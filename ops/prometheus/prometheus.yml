global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: regiomovil
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['app:9091']
    scrape_timeout: 5s
    sample_limit: 20000
    label_limit: 8
    label_name_length_limit: 64
    label_value_length_limit: 100
